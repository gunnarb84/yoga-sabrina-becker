services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yoga_sabrina_becker_app
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Yoga Sabrina Becker"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_LOCALE: de
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: de_DE
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: yoga
      DB_USERNAME: yoga
      DB_PASSWORD: yoga
      BCRYPT_ROUNDS: 12
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: "info@yoga-sabrina-becker.example"
      MAIL_FROM_NAME: "Yoga Sabrina Becker"
      DOCKER_ADMIN_EMAIL: sabrina@example.com
      DOCKER_ADMIN_PASSWORD: yoga2026
      DOCKER_SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - yoga_storage:/var/www/html/src/storage
      - yoga_bootstrap_cache:/var/www/html/src/bootstrap/cache
    networks:
      - yoga_network

  db:
    image: mysql:8.0
    container_name: yoga_sabrina_becker_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yoga
      MYSQL_USER: yoga
      MYSQL_PASSWORD: yoga
    ports:
      - "3307:3306"
    volumes:
      - yoga_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "yoga", "-pyoga"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yoga_network

volumes:
  yoga_db:
  yoga_storage:
  yoga_bootstrap_cache:

networks:
  yoga_network:
    driver: bridge
